name: Mobile CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.38.5
  FLUTTER_SOURCE_SHA: f6ff1529fd6d8af5f706051d9251ac9231c83407
  CI_MOBILE_USE_SYSTEM_FLUTTER: "1"

jobs:
  boundaries:
    name: Bootstrap boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify non-production boundaries
        run: bash scripts/ci/verify_bootstrap_boundaries.sh

  quality-and-android-smoke:
    name: Format, analyze, coverage, Android smoke
    needs: boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Flutter source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          actual_sha="$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)"
          [[ "$actual_sha" == "$FLUTTER_SOURCE_SHA" ]]
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Cache locked dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      - name: Record toolchain
        run: |
          flutter config --no-analytics
          uname -a
          cat /etc/os-release
          flutter --version
          flutter --version --machine
          java -version
          java -version 2>&1 | grep -Fq 'version "17.'
          sha256sum test/fixtures/fonts/nanum_gothic/NanumGothic-Regular.ttf
          stat --format='Bundled font size: %s bytes' \
            test/fixtures/fonts/nanum_gothic/NanumGothic-Regular.ttf

      - name: Run mobile quality and Android gates
        run: bash scripts/ci_mobile.sh

      - name: Upload golden failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golden-failures-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/**/failures/**
          if-no-files-found: warn
          retention-days: 7

  gate-fixtures:
    name: Intentional gate failure fixtures
    needs: boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Flutter source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          actual_sha="$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)"
          [[ "$actual_sha" == "$FLUTTER_SOURCE_SHA" ]]
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Cache locked dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      - name: Verify intentional lint, lockfile, and generated diff failures
        run: bash scripts/ci_mobile_gate_fixtures.sh

  ios-smoke:
    name: iOS no-codesign smoke
    needs: boundaries
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Flutter source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          actual_sha="$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)"
          [[ "$actual_sha" == "$FLUTTER_SOURCE_SHA" ]]
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Cache locked dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      - name: Record Apple toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          sw_vers
          uname -m
          flutter config --no-analytics
          flutter --version
          xcodebuild -version
          xcodebuild -version | grep -Fxq 'Xcode 16.4'
          xcodebuild -version | grep -Fxq 'Build version 16F6'

      - name: Run iOS no-codesign gates
        run: bash scripts/ci_mobile.sh ios
