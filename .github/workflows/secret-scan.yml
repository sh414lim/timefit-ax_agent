name: Secret Scan

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  current-and-history:
    name: Current tree and full history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned verified Gitleaks
        run: bash scripts/security/install_gitleaks.sh "$RUNNER_TEMP/gitleaks"

      - name: Verify scanner failure boundaries
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks/gitleaks
        run: bash scripts/security/test_secret_scan.sh

      - name: Scan current tree
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks/gitleaks
        run: bash scripts/security/run_secret_scan.sh current

      - name: Scan complete history
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks/gitleaks
        run: bash scripts/security/run_secret_scan.sh history
