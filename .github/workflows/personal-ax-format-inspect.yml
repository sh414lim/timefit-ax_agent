name: Personal AX Dart format inspection (temporary)
on:
  pull_request:

permissions:
  contents: read

jobs:
  format-inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install pinned Flutter 3.38.5 for formatter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch 3.38.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "f6ff1529fd6d8af5f706051d9251ac9231c83407"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Print exact formatting patch without mutating GitHub
        run: |
          set -euo pipefail
          dart format lib/dev/main_personal_ax.dart test/dev/personal_ax_screen_test.dart
          git diff -- lib/dev/main_personal_ax.dart test/dev/personal_ax_screen_test.dart
