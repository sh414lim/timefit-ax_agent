name: timefit_native
description: TimeFit native iOS and Android application bootstrap.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.10.4 <3.11.0"
  flutter: 3.38.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: 17.5.0
  supabase_flutter: 2.18.0
  drift: 2.27.0
  sqlite3_flutter_libs: 0.5.41
  freezed_annotation: 2.4.4
